name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Bump, merge & release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Sync develop with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit
          git push origin develop

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --tb=short -q

      - name: Bump version
        id: bump
        run: |
          python3 - "${{ inputs.bump }}" <<'PYEOF'
          import re, sys

          bump_type = sys.argv[1]
          path = "pyproject.toml"

          with open(path) as f:
              text = f.read()

          match = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not match:
              sys.exit("Could not find version in pyproject.toml")

          major, minor, patch = int(match.group(1)), int(match.group(2)), int(match.group(3))

          if bump_type == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump_type == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          text = text[:match.start()] + f'version = "{new_version}"' + text[match.end():]

          with open(path, "w") as f:
              f.write(text)

          print(f"Bumped to {new_version}")
          PYEOF

          NEW_VERSION=$(python3 -c "
          import re
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read(), re.MULTILINE)
          print(m.group(1))
          ")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump to develop
        run: |
          git add pyproject.toml
          git commit -m "ci: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin develop

      - name: Fast-forward merge into main
        run: |
          git checkout main
          git merge --ff-only develop
          git push origin main

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          target_commitish: main
          generate_release_notes: true
