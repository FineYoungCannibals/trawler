name: Version bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, 'ci: bump version')"
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Determine bump
        id: bump
        run: |
          commit_msg="${{ github.event.head_commit.message }}"
          if [[ "$commit_msg" == *"major/"* || "$commit_msg" == *"breaking/"* ]]; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif [[ "$commit_msg" == *"minor/"* || "$commit_msg" == *"feature/"* ]]; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif [[ "$commit_msg" == *"patch/"* || "$commit_msg" == *"bugfix/"* || "$commit_msg" == *"fix/"* ]]; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            # Default to patch when no explicit bump marker is found.
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest -q -p no:cacheprovider tests

      - name: Bump version
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          new_version=$(python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          bump = os.environ["BUMP"]
          path = Path("pyproject.toml")
          data = tomllib.loads(path.read_text())
          version = data["project"]["version"]
          major, minor, patch = map(int, version.split("."))

          if bump == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump == "minor":
              minor += 1
              patch = 0
          elif bump == "patch":
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          text = path.read_text()
          new_text = re.sub(r'(?m)^version\s*=\s*"\d+\.\d+\.\d+"', f'version = "{new_version}"', text)
          if text == new_text:
              raise SystemExit("version line not found")
          path.write_text(new_text)
          print(new_version)
          PY
          )
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No version change; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "ci: bump version to ${{ steps.version.outputs.version }}"
          git push
