name: Version Bump

on:
  push:
    branches: [main]

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    # Skip if this commit was itself a version bump (prevents infinite loop)
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Determine bump type
        id: bump_type
        run: |
          commit_msg="${{ github.event.head_commit.message }}"
          if [[ "$commit_msg" == *"major/"* || "$commit_msg" == *"breaking/"* ]]; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif [[ "$commit_msg" == *"minor/"* || "$commit_msg" == *"feature/"* ]]; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif [[ "$commit_msg" == *"patch/"* || "$commit_msg" == *"bugfix/"* || "$commit_msg" == *"fix/"* ]]; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in pyproject.toml
        run: |
          current=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r major minor patch <<< "$current"
          bump="${{ steps.bump_type.outputs.bump }}"
          if [[ "$bump" == "major" ]]; then
            major=$((major + 1)); minor=0; patch=0
          elif [[ "$bump" == "minor" ]]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          new_version="${major}.${minor}.${patch}"
          sed -i "s/^version = \".*\"/version = \"${new_version}\"/" pyproject.toml
          echo "NEW_VERSION=${new_version}" >> "$GITHUB_ENV"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }}"
          git tag "v${{ env.NEW_VERSION }}"
          git push
          git push --tags
