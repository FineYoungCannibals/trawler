[project]
name = "trawler"
version = "0.2.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "chromadb>=0.5",
    "httpx>=0.28.1",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "langchain>=0.3",
    "langchain-chroma>=0.1",
    "langchain-huggingface>=0.1",
    "langchain-text-splitters>=0.3",
    "python-ripgrep>=0.0.9",
    "sentence-transformers>=3.0",
    "textual[syntax]>=8.0.2",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "yara-python>=4.5.4",
]

[project.optional-dependencies]
llm = ["mlx-lm>=0.22"]
llm-cpu = ["llama-cpp-python"]

[dependency-groups]
dev = ["pytest>=9.0.2", "textual-dev>=1.8.0"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trawler = ["rules/*.yar", "rules/*.yara"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
